name: start or stop

# The workflow does both directions, so it is named for the choice rather than
# for one side of it. A green tick labelled "shutdown" on a run that started
# the environment reads as the opposite of what happened.
#
# Stops the parts of an environment that can be stopped, on a weekday evening.
#
# Cost, honestly: this saves the Postgres compute charge and the integration
# hub's always-on replica. It does not save Redis, the NAT Gateway, the public
# IP, the container registry or Log Analytics retention - those bill by the
# hour whether anything uses them and can only be deleted, not stopped. If the
# idle cost still looks wrong after this, deleting those is the next step, and
# it is a bigger decision than a nightly job should make on its own.
#
# Nothing here touches data or Terraform state. `start` puts it back. A normal
# `terraform apply` does not: it restores the container apps' replica counts,
# but this configuration never manages whether the Postgres server is running,
# so a stopped server stays stopped until `start` runs.

# Names the run itself, so the Actions list reads "start - dev" rather than
# the workflow name repeated down the page.
run-name: ${{ inputs.action || 'stop' }} - ${{ inputs.environment || 'dev' }}

on:
  schedule:
    # GitHub cron is UTC and does not observe daylight saving, so 17:00 in
    # London needs both entries. The guard below drops whichever one is an
    # hour out today, so exactly one of them does the work.
    - cron: "0 16 * * 1-5"   # 17:00 London while BST is in force
    - cron: "0 17 * * 1-5"   # 17:00 London while GMT is in force
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        required: true
        default: dev
        type: choice
        options: [dev, staging, prod]
      action:
        description: stop or start
        required: true
        default: stop
        type: choice
        options: [stop, start]

permissions:
  contents: read
  id-token: write

jobs:
  start-or-stop:
    name: ${{ inputs.action || 'stop' }} ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    env:
      ENVIRONMENT: ${{ inputs.environment || 'dev' }}
      ACTION: ${{ inputs.action || 'stop' }}
      PREFIX: ftpay
      # The containerapp commands live in an extension. Install it without
      # asking, since there is nobody at the keyboard.
      AZURE_EXTENSION_USE_DYNAMIC_INSTALL: yes_without_prompt

    steps:
      # Both cron entries fire every weekday; only one of them is 17:00 in
      # London. Checking the actual local hour is simpler than reasoning about
      # when the clocks change.
      - name: Is it 17:00 in London?
        if: github.event_name == 'schedule'
        run: |
          HOUR=$(TZ=Europe/London date +%H)
          if [ "$HOUR" != "17" ]; then
            echo "London time is ${HOUR}:00, not 17:00 - the other schedule covers today."
            echo "SKIP=true" >> "$GITHUB_ENV"
          else
            echo "London time is 17:00. Proceeding."
          fi

      - name: Sign in to Azure
        if: env.SKIP != 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Stop or start the environment
        if: env.SKIP != 'true'
        run: |
          set -euo pipefail
          RG="rg-${PREFIX}-${ENVIRONMENT}"

          # `az group exists` says false only when the group is not there. A
          # sign-in, permission or wrong-subscription failure is an error, and
          # set -e stops on it - `az group show 2>/dev/null` used to read all
          # of those as "does not exist" and finish green.
          EXISTS=$(az group exists -n "$RG")
          if [ "$EXISTS" != "true" ]; then
            if [ "$ACTION" = "start" ]; then
              echo "::error::Resource group $RG does not exist - there is no environment to start."
              exit 1
            fi
            echo "::notice::Resource group $RG does not exist - nothing to stop."
            exit 0
          fi

          # Names are read from the resource group rather than assumed, so a
          # rename in Terraform does not silently turn this into a no-op.
          SERVERS=$(az postgres flexible-server list -g "$RG" --query "[].name" -o tsv)
          APPS=$(az containerapp list -g "$RG" --query "[].name" -o tsv)

          echo "Resource group : $RG"
          echo "Postgres       : ${SERVERS:-none}"
          echo "Container apps : ${APPS:-none}"
          echo

          # Every environment has both. An empty list means the group is not
          # the one Terraform built, and the summary would claim work not done.
          if [ -z "$SERVERS" ] || [ -z "$APPS" ]; then
            echo "::error::$RG has no Postgres server or no container apps, so there is nothing here to $ACTION."
            exit 1
          fi

          if [ "$ACTION" = "stop" ]; then
            for S in $SERVERS; do
              STATE=$(az postgres flexible-server show -g "$RG" -n "$S" --query state -o tsv)
              if [ "$STATE" = "Ready" ]; then
                echo "stopping  $S"
                az postgres flexible-server stop -g "$RG" -n "$S" --output none
              else
                echo "skipping  $S (state: $STATE)"
              fi
            done

            # Only the hub actually holds a replica open; the others are
            # already at zero. Setting them all is idempotent and means this
            # keeps working if a future app is left warm.
            for A in $APPS; do
              echo "scaling   $A to 0 replicas"
              az containerapp update -g "$RG" -n "$A" --min-replicas 0 --output none
            done
          else
            for S in $SERVERS; do
              STATE=$(az postgres flexible-server show -g "$RG" -n "$S" --query state -o tsv)
              if [ "$STATE" = "Stopped" ]; then
                echo "starting  $S"
                az postgres flexible-server start -g "$RG" -n "$S" --output none
              else
                echo "skipping  $S (state: $STATE)"
              fi
            done

            # Terraform owns the real replica counts. Restoring the hub here
            # covers the common case; a `terraform apply` restores every app's
            # replicas to whatever the configuration says, but it never starts
            # a stopped Postgres server - only the loop above does that.
            RESTORED=0
            for A in $APPS; do
              case "$A" in
                *integration-hub)
                  echo "scaling   $A back to 1 replica"
                  az containerapp update -g "$RG" -n "$A" --min-replicas 1 --output none
                  RESTORED=$((RESTORED + 1))
                  ;;
              esac
            done

            # A hub left at zero delivers nothing and nothing wakes it.
            if [ "$RESTORED" -eq 0 ]; then
              echo "::error::No integration hub found in $RG to scale back to 1 replica - run terraform apply to restore it."
              exit 1
            fi
          fi

      - name: Summary
        if: env.SKIP != 'true'
        run: |
          # "start" + "ped" is "startped". The past tense is irregular
          # enough to be worth spelling out.
          case "$ACTION" in
            start) VERB=started ;;
            stop)  VERB=stopped ;;
          esac
          {
            echo "### ${ACTION} — ${ENVIRONMENT}"
            echo
            echo "Postgres compute and the always-on container replica are"
            echo "${VERB}. Redis, the NAT gateway, the public IP, the"
            echo "container registry and Log Analytics are untouched either"
            echo "way: they bill by the hour and can only be deleted."
          } >> "$GITHUB_STEP_SUMMARY"
