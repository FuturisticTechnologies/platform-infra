name: infrastructure

# Plan on every pull request, apply on merge. Environments carry the approval
# gates, so a production change is reviewed twice: once as code, once at the
# point it is applied.

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        required: true
        type: choice
        options: [dev, staging, prod]

permissions:
  contents: read
  id-token: write        # OIDC federated credential
  pull-requests: write   # plan summary comment

env:
  TF_VERSION: 1.15.8
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_use_oidc: true
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format
        run: terraform fmt -check -recursive

      - name: Validate
        run: |
          terraform init -backend=false
          terraform validate

      - uses: terraform-linters/setup-tflint@v4
      - name: Lint
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=error

  plan:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Without this the provider fails with "a Tenant ID must be configured
      # when authenticating with OIDC", which says nothing about the cause.
      - name: Check pipeline identity is configured
        run: |
          missing=""
          if [ -z "${{ vars.AZURE_CLIENT_ID }}" ]; then missing="$missing AZURE_CLIENT_ID"; fi
          if [ -z "${{ vars.AZURE_TENANT_ID }}" ]; then missing="$missing AZURE_TENANT_ID"; fi
          if [ -z "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]; then missing="$missing AZURE_SUBSCRIPTION_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables:$missing"
            echo "This repository has no Azure identity yet. Run:"
            echo "  ./bootstrap/bootstrap.sh <subscription-id> <org>/<repo>"
            echo "then add the three variables it prints under"
            echo "Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - name: Init
        run: terraform init -backend-config=envs/backend-${{ matrix.environment }}.hcl

      - name: Plan
        id: plan
        run: |
          terraform plan \
            -var-file=envs/${{ matrix.environment }}.tfvars \
            -out=tfplan-${{ matrix.environment }} \
            -detailed-exitcode -no-color | tee plan.txt
        continue-on-error: true

      # Exit code 2 means "changes to apply", which is not a failure.
      - name: Check plan result
        run: |
          code=${{ steps.plan.outcome == 'success' && '0' || '1' }}
          if [ "$code" != "0" ] && ! grep -q "Plan:" plan.txt; then
            echo "::error::terraform plan failed"
            tail -50 plan.txt
            exit 1
          fi

      - name: Comment plan on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8');
            const summary = plan.match(/^Plan: .*$/m)?.[0] ?? 'No changes.';
            const body = [
              `### Terraform plan — \`${{ matrix.environment }}\``,
              '',
              `**${summary}**`,
              '',
              '<details><summary>Full plan</summary>',
              '',
              '```terraform',
              plan.slice(-60000),
              '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: tfplan-${{ matrix.environment }}
          retention-days: 5

  # dev applies automatically from the development branch. Staging and
  # production do NOT apply on a merge - they are deliberately manual.
  #
  # The original design put the approval gate on the GitHub environment, but
  # required reviewers need Pro/Team/Enterprise on a private repository and
  # this one is on Free. Without that rule an environment is only a label, and
  # a merge to main would build the production stack - zone-redundant
  # Postgres, GZRS storage, always-warm replicas - with nobody in the loop.
  #
  # So the gate is the workflow_dispatch itself: someone chooses the
  # environment and presses the button. Move these back to `push` once the
  # plan supports required reviewers.
  apply-dev:
    needs: plan
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    uses: ./.github/workflows/terraform-apply.yml
    with:
      environment: dev
    secrets: inherit

  apply-manual:
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/terraform-apply.yml
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit
