name: infrastructure

# dev only, for now. Staging and production are not wired into this pipeline:
# their tfvars and backend configs still exist under envs/, but nothing plans
# or applies them until somebody decides to bring them in.

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        required: true
        default: dev
        type: choice
        options: [dev]

permissions:
  contents: read
  id-token: write        # OIDC federated credential
  pull-requests: write   # plan summary comment

env:
  TF_VERSION: 1.15.8
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_use_oidc: true
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format
        run: terraform fmt -check -recursive

      - name: Validate
        run: |
          terraform init -backend=false
          terraform validate

      - uses: terraform-linters/setup-tflint@v4
      - name: Lint
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=error

  plan:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Without this the provider fails with "a Tenant ID must be configured
      # when authenticating with OIDC", which says nothing about the cause.
      #
      # Read from the environment rather than interpolating: these are secrets
      # now, and an interpolated secret ends up on a command line.
      - name: Check pipeline identity is configured
        run: |
          missing=""
          if [ -z "$ARM_CLIENT_ID" ]; then missing="$missing AZURE_CLIENT_ID"; fi
          if [ -z "$ARM_TENANT_ID" ]; then missing="$missing AZURE_TENANT_ID"; fi
          if [ -z "$ARM_SUBSCRIPTION_ID" ]; then missing="$missing AZURE_SUBSCRIPTION_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "This repository has no Azure identity yet. Run:"
            echo "  ./bootstrap/bootstrap.sh <subscription-id> <org>/<repo>"
            echo "then add the three values it prints under"
            echo "Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi

      - name: Init
        run: terraform init -backend-config=envs/backend-dev.hcl

      - name: Plan
        id: plan
        run: |
          terraform plan \
            -var-file=envs/dev.tfvars \
            -out=tfplan-dev \
            -detailed-exitcode -no-color | tee plan.txt
        continue-on-error: true

      # Exit code 2 means "changes to apply", which is not a failure.
      - name: Check plan result
        run: |
          code=${{ steps.plan.outcome == 'success' && '0' || '1' }}
          if [ "$code" != "0" ] && ! grep -q "Plan:" plan.txt; then
            echo "::error::terraform plan failed"
            tail -50 plan.txt
            exit 1
          fi

      - name: Comment plan on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8');
            const summary = plan.match(/^Plan: .*$/m)?.[0] ?? 'No changes.';
            const body = [
              '### Terraform plan — `dev`',
              '',
              `**${summary}**`,
              '',
              '<details><summary>Full plan</summary>',
              '',
              '```terraform',
              plan.slice(-60000),
              '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: tfplan-dev
          retention-days: 5

  # dev applies automatically from the development branch, and can be applied
  # from any branch with the manual dispatch. There is no approval gate:
  # required reviewers need Pro/Team/Enterprise on a private repository and
  # this one is on Free, so a GitHub environment is only a label here. That is
  # tolerable for dev and would not be for production - which is one more
  # reason staging and prod are not wired in yet.
  apply-dev:
    needs: plan
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    uses: ./.github/workflows/terraform-apply.yml
    with:
      environment: dev
    secrets: inherit

  apply-manual:
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/terraform-apply.yml
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit
