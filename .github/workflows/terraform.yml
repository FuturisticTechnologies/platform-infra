name: infrastructure

# The environment is chosen from the Run workflow dropdown and defaults to dev
# on a pull request or a push, where there is nobody to ask. Everything - the
# Azure identity, the state file, the sizing - follows that one choice.
#
# Only dev is set up today. Picking staging or prod fails on the identity
# check, by design: it is a missing environment secret, not a broken pipeline.

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        required: true
        default: dev
        type: choice
        options: [dev, staging, prod]

permissions:
  contents: read
  id-token: write        # OIDC federated credential
  pull-requests: write   # plan summary comment

# One run at a time per environment. Every job here talks to the same state
# blob, and Terraform's own lock turns an overlap into a failed run rather
# than a corrupted state - which is the right outcome, but a queue is a better
# one. Not cancel-in-progress: killing a run mid-apply is how a lock gets left
# behind holding a lease nobody owns.
concurrency:
  group: terraform-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  TF_VERSION: 1.15.8
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_use_oidc: true
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format
        run: terraform fmt -check -recursive

      - name: Validate
        run: |
          terraform init -backend=false
          terraform validate

      - uses: terraform-linters/setup-tflint@v4
      - name: Lint
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=error

  plan:
    needs: validate
    runs-on: ubuntu-latest
    # The Azure identity is held as environment secrets, so each environment
    # can carry its own subscription and app registration. A job only sees an
    # environment's secrets if it declares one - hence this on a job that
    # otherwise has no reason to name an environment.
    #
    # `inputs.environment` is empty for pull_request and push, which have no
    # dropdown to read, so those default to dev.
    #
    # One consequence: an approval rule on an environment gates its plans as
    # well as its applies. Dev is ungated so it does not arise; a higher
    # environment that wants review on applies needs a plan-only environment.
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Without this the provider fails with "a Tenant ID must be configured
      # when authenticating with OIDC", which says nothing about the cause.
      #
      # Read from the environment rather than interpolating: these are secrets
      # now, and an interpolated secret ends up on a command line.
      - name: Check pipeline identity is configured
        run: |
          missing=""
          if [ -z "$ARM_CLIENT_ID" ]; then missing="$missing AZURE_CLIENT_ID"; fi
          if [ -z "$ARM_TENANT_ID" ]; then missing="$missing AZURE_TENANT_ID"; fi
          if [ -z "$ARM_SUBSCRIPTION_ID" ]; then missing="$missing AZURE_SUBSCRIPTION_ID"; fi
          if [ -n "$missing" ]; then
            ENV_NAME="${{ inputs.environment || 'dev' }}"
            echo "::error::Environment '$ENV_NAME' is missing:$missing"
            echo "Environment secrets live per environment, so this says the"
            echo "'$ENV_NAME' environment has no Azure identity - not that the"
            echo "pipeline is broken. Only dev is set up today."
            echo
            echo "To set one up:"
            echo "  ./bootstrap/bootstrap.sh <subscription-id> <org>/<repo>"
            echo "then Settings > Environments > $ENV_NAME > Environment secrets,"
            echo "and add the three values it prints."
            exit 1
          fi

      - name: Init
        run: terraform init -backend-config=envs/backend-${{ inputs.environment || 'dev' }}.hcl

      - name: Plan
        id: plan
        run: |
          terraform plan \
            -var-file=envs/${{ inputs.environment || 'dev' }}.tfvars \
            -out=tfplan-${{ inputs.environment || 'dev' }} \
            -detailed-exitcode -no-color | tee plan.txt
        continue-on-error: true

      # Exit code 2 means "changes to apply", which is not a failure.
      - name: Check plan result
        run: |
          code=${{ steps.plan.outcome == 'success' && '0' || '1' }}
          if [ "$code" != "0" ] && ! grep -q "Plan:" plan.txt; then
            echo "::error::terraform plan failed"
            tail -50 plan.txt
            exit 1
          fi

      - name: Comment plan on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8');
            const summary = plan.match(/^Plan: .*$/m)?.[0] ?? 'No changes.';
            const body = [
              `### Terraform plan \u2014 \`${{ inputs.environment || 'dev' }}\``,
              '',
              `**${summary}**`,
              '',
              '<details><summary>Full plan</summary>',
              '',
              '```terraform',
              plan.slice(-60000),
              '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment || 'dev' }}
          path: tfplan-${{ inputs.environment || 'dev' }}
          retention-days: 5

  # A push to dev applies the dev environment. There is no dropdown on a push, so
  # this one path names its environment. Everything else follows the selection.
  # There is no approval gate:
  # required reviewers need Pro/Team/Enterprise on a private repository and
  # this one is on Free, so a GitHub environment is only a label here. That is
  # tolerable for dev and would not be for production - which is one more
  # reason staging and prod are not wired in yet.
  apply-dev:
    needs: plan
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    uses: ./.github/workflows/terraform-apply.yml
    with:
      environment: dev
    secrets: inherit

  # needs: plan, not validate. Both jobs run terraform against the same state
  # blob, so hanging them off validate started them together and they raced
  # for the lock - plan took it, apply failed acquiring it, every dispatch.
  # This also means a plan that cannot even authenticate skips the apply
  # instead of failing it a second time for a different reason.
  apply-manual:
    needs: plan
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/terraform-apply.yml
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit
